    scene = new THREE.Scene();

    car = MODELS.ego ? (() => { const g = new THREE.Group(); g.add(cadVehicle('ego', '#F1F1EE')); return g; })() : buildCar(); car.add(shadow); shadow.position.set(0, 0.02, 0); scene.add(car);

    ui.platemode = QS.has('plate');            // plate: splat world only
    ui.platecars = QS.has('platecars');        // platecars: enhanced world + traffic cars (for the final AI pass), no HUD/path
    ui.enh = idx.enhanced ? { n: idx.enhanced.n, img: new Image(), tex: new THREE.Texture() } : null;
    if (ui.enh && !QS.has('plate') && !QS.has('raw')) { ui.enh.tex.colorSpace = THREE.SRGBColorSpace; scene.background = ui.enh.tex; }      // the piece is one 3D Gaussian world; projection is a debug view only
    idx.carMasks = (await (await fetch(`${DATA}/cars.json`)).json().catch(() => ({}))).masks || {};
    buildUI(stage);
    if (ui.platemode || ui.platecars) stage.querySelectorAll('div,img,svg').forEach((d) => (d.style.visibility = 'hidden'));   // plates: the 3D pane only
  },
  async render(t) {
    const fd = frameData(t), td = fd.td;
    // ---- camera: front-camera pose -> over the roof -> chase ----
    const u = ease.inOutCubic(clamp((t - C.pullStart) / (C.pullEnd - C.pullStart)));
    const yawC = lerp(fd.yaw, chase[Math.min(chase.length - 1, Math.round(t * FPS))], u);
    const bz = (a, b, c, s) => (1 - s) * (1 - s) * a + 2 * (1 - s) * s * b + s * s * c;
    const ex = 0, ey = bz(1.48, 3.6, 3.4, u), ez = bz(-0.45, 1.0, 10.0, u);     // car frame (+z = behind)
    const ty = lerp(1.49, 0.6, u), tz = lerp(-40, -22, u);
    const toW = (x, z, yaw) => ({ x: fd.x + Math.cos(yaw) * x - Math.sin(yaw) * z, z: fd.z + Math.sin(yaw) * x + Math.cos(yaw) * z });

    const vfov0 = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(25.2)) / (PANE.w / PANE.h)) * 180 / Math.PI;
    camera.fov = lerp(vfov0, 44, u); camera.aspect = PANE.w / PANE.h; camera.updateProjectionMatrix();
    const fy = PANE.h / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    splats.material.uniforms.focal.value.set(fy, fy);
    // ---- which splats: crossfade the two keyframes around td, road history behind ----
    const kq = (td - idx.kf[0].t) * idx.kfps, ki = Math.floor(kq), kf = kq - ki;
    const useEnh = ui.enh && !QS.has('plate') && !QS.has('raw');
    if (useEnh) {   // diffusion-enhanced plate of the splat world for this frame (prep/enhance_job.py)
      const src = `${DATA}/${idx.enhanced.dir || 'enhanced'}/${String(Math.min(ui.enh.n - 1, Math.round(frameTime() * FPS)) + 1).padStart(4, '0')}.jpg`;
      if (ui.enh.img.__src !== src) { ui.enh.img.__src = src; ui.enh.img.src = src; await ui.enh.img.decode().catch(() => {}); ui.enh.tex.image = ui.enh.img; ui.enh.tex.needsUpdate = true; }
    }
    const n = (QS.has('nosplat') || useEnh) ? 0 : fillSplats(KF.map((k, i) => ({ kf: i, alpha: i ? 1 : 0.96 })), camera); if (QS.has('nosplat') || useEnh) splats.geometry.instanceCount = 0;
    ui.ground.visible = !useEnh;
    // ---- ego car, path ----
    car.position.set(fd.x, 0, fd.z); car.rotation.y = -fd.yaw;
    const carFrameY = ey, carFrameZ = ez;
    const carsBaked = useEnh && idx.enhanced.cars;      // the AI pass already drew the cars into the frame
    car.visible = !ui.platemode && !carsBaked && (carFrameY > 1.85 || carFrameZ > 2.6);
    updateRibbon(td, fd); ribbon.visible = !ui.platemode && !ui.platecars;
    for (const { tr, g } of ui.vehicles) {
      const p = trackPose(tr, td);
      const near = p && Math.hypot(p.x - fd.x, p.z - fd.z);
      if (ui.platemode || carsBaked || !p || near > 90 || near < 2.2) { g.visible = false; continue; }
      g.visible = true; g.position.set(p.x, 0, p.z); g.rotation.y = -p.yaw;
      const op = p.fade * (1 - smoothstep(60, 90, near));
      g.traverse((o) => { if (o.isMesh) o.material.opacity = op * (o.material.userData.base ?? (o.material.userData.base = o.material.opacity)); });
    }
    ribbon.material.uniforms.on.value = smoothstep(C.pullStart + 1.2, C.pullEnd, t);
    if (ui.envs.length) { const e = ui.envs.reduce((a, b) => (Math.abs(b.t - td) < Math.abs(a.t - td) ? b : a)); scene.environment = e.env; }
    PJ.meshes.forEach((M) => (M.mesh.visible = !QS.has('nomesh')));
    if (PJ.on) await updateProjection(td, fd, Math.min(idx.frames.length - 1, Math.round(frameTime() * FPS)), camera.position);
    ui.ground.material.uniforms.eye.value.copy(camera.position); ui.ground.position.set(camera.position.x, -0.03, camera.position.z);
    window.__cam = { p: camera.position.toArray(), q: camera.quaternion.toArray(), fov: camera.fov, w: PANE.w, h: PANE.h };   // prep/camdump.mjs
    renderer.render(scene, camera);

    // ---- HUD ----
    const ft = frameTime(), fk = Math.min(idx.frames.length - 1, Math.round(ft * FPS)), F = idx.frames[fk];
    const hudOn = smoothstep(C.pullEnd - 1.2, C.pullEnd, t);
    set(ui.hud, { opacity: 0.0001 + 0.9999 * hudOn });
    const mph = Math.round(Math.max(0, F.v) * 2.23694);
    ui.speed.textContent = String(mph);
    ui.gear.innerHTML = ['P', 'R', 'N', 'D'].map((g) => g === 'D' ? `<span style="color:#fff">${g}</span>` : g).join(' ');
    set(ui.fsd, { opacity: F.ap === 'self_driving' ? 1 : 0.35 });
    // blinkers flash at 1.5 Hz from when the signal came on
    const flash = (key) => { let k = fk; while (k > 0 && idx.frames[k - 1][key]) k--; const age = (fk - k) / FPS; return idx.frames[fk][key] && (age * 1.5 % 1) < 0.55; };
    set(ui.bl, { opacity: flash('bl') ? 1 : 0.12 }); set(ui.br, { opacity: flash('br') ? 1 : 0.12 });
    // maneuver card from the trajectory: distance along the path to the turn apex
    let man = '';
    if (td < TURN.t + 0.6) {
      let d = 0, p = pathAt(td); for (let s = td; s < TURN.t; s += 1 / 60) { const q = pathAt(s + 1 / 60); d += Math.hypot(q.x - p.x, q.z - p.z); p = q; }
      const ftn = Math.max(0, Math.round(d * 3.28084 / 10) * 10);
      man = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${TURN.dir < 0 ? '<path d="M15 21V11a3 3 0 0 0-3-3H5"/><path d="M9 4 5 8l4 4"/>' : '<path d="M9 21V11a3 3 0 0 1 3-3h7"/><path d="m15 4 4 4-4 4"/>'}</svg><div><div style="font:600 17px ${sans}">${ftn > 0 ? ftn + ' ft' : 'Now'}</div><div style="font:400 12px ${sans};color:#AEB4BC">Turn ${TURN.dir < 0 ? 'left' : 'right'}</div></div>`;
    } else if (F.br || F.bl) {
      man = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M7 21V13c0-2 1-3 3-4l4-2"/><path d="M17 21V3"/></svg><div><div style="font:600 17px ${sans}">${td - TURN.t > 3 ? 'Changing lanes' : 'Turn signal'}</div><div style="font:400 12px ${sans};color:#AEB4BC">${F.br ? 'Right' : 'Left'} · signal on</div></div>`;
    }
    if (ui.man.__html !== man) { ui.man.innerHTML = man; ui.man.__html = man; }
    set(ui.man, { opacity: man ? 1 : 0 });
    // sky chevrons over the exit road of the turn (projected from 3D each frame)
    const chevOn = smoothstep(TURN.t - 3.2, TURN.t - 2.4, td) * (1 - smoothstep(TURN.t + 0.4, TURN.t + 1.2, td));
    ui.chevs.forEach((d, i) => {
      const p = pathAt(TURN.t + 0.9 + i * 0.32), q = pathAt(TURN.t + 1.0 + i * 0.32);
      const v = new THREE.Vector3(p.x, 5.2, p.z).project(camera), v2 = new THREE.Vector3(q.x, 5.2, q.z).project(camera);
      const sx = (v.x * 0.5 + 0.5) * PANE.w, sy = (1 - (v.y * 0.5 + 0.5)) * PANE.h;
      const ang = Math.atan2(-(v2.y - v.y), v2.x - v.x) * 180 / Math.PI + 180;
      const vis = v.z < 1 && v.z > -1 ? chevOn : 0;
      const dist = Math.hypot(p.x - camera.position.x, p.z - camera.position.z);
      set(d, { transform: `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) rotate(${ang.toFixed(1)}deg) scale(${clamp(28 / dist, 0.35, 1.6).toFixed(3)})`, opacity: vis * 0.92 });
    });
    // drive card
    ui.clock.textContent = `Drive · ${idx.clip || 'clip_00'}`;
    ui.sub.textContent = `t ${fmt(td)}  ·  seq ${Math.round(td * 36)}  ·  kf ${String(Math.max(0, ki)).padStart(3, '0')}`;
    ui.time.textContent = `${fmt(ft)} / ${fmt(T)}`;
    set(ui.bar, { width: Math.round(200 * ft / T) });
    ui.count.textContent = `${(useEnh ? KF.reduce((a, k) => a + (k.n || 0), 0) : n).toLocaleString('en-US')} GAUSSIANS`;   // the world the plate was rendered from
    ui.tel.textContent = `speed   ${F.v.toFixed(2).padStart(6)} m/s   steer ${F.steer.toFixed(1).padStart(6)}°\nheading ${(F.yaw * 180 / Math.PI).toFixed(1).padStart(6)}°     state ${F.ap}\nblinker ${F.bl ? 'L' : '·'} ${F.br ? 'R' : '·'}            frame ${String(Math.round(F.t * 36)).padStart(5)}`;
    // camera feeds (frame-exact jpgs extracted at 30 fps)
    await Promise.all(ui.tiles.map(async (tl) => {
      const src = `${DATA}/cams/${tl.cam}/${String(fk + 1).padStart(4, '0')}.jpg`;
      if (tl.img.__src !== src) { tl.img.__src = src; tl.img.src = src; await tl.img.decode().catch(() => {}); }
    }));
  },
  score(a) {
    const F = a.frame;
    a.room(0, T, { gain: 0.012 });
    // road + tyre noise, following the recorded speed
    const n = a.noise(a.at(0), T), lp = a.ctx.createBiquadFilter(), bp = a.ctx.createBiquadFilter(), g = a.ctx.createGain();
    lp.type = 'lowpass'; bp.type = 'peaking'; bp.frequency.value = 180; bp.gain.value = 6;
    g.gain.setValueAtTime(0.0001, a.at(0));
    for (let k = 0; k < idx.frames.length; k += 6) {
      const f = idx.frames[k], v = clamp(f.v / 28);
      g.gain.linearRampToValueAtTime(0.03 + 0.16 * Math.pow(v, 1.4), a.at(k / FPS));
      lp.frequency.linearRampToValueAtTime(260 + 1100 * v, a.at(k / FPS));
    }
    g.gain.linearRampToValueAtTime(0.0001, a.at(T));
    n.connect(lp).connect(bp).connect(g); a.out(g, { bus: a.amb || a.sfx });
    // blinker relay: tick when the lamp lights, tock when it drops (1.5 Hz, from the telemetry signal)
    for (const key of ['bl', 'br']) {
      let on = null;
      idx.frames.forEach((f, k) => {
        const t = k / FPS;
        if (f[key] && on === null) on = t;
        if ((!f[key] || k === idx.frames.length - 1) && on !== null) {
          for (let c = on; c < t; c += 1 / 1.5) { a.tick(c + F, { gain: 0.22, pitch: 0.9 }); if (c + 0.55 / 1.5 < t) a.tock(c + 0.55 / 1.5 + F, { gain: 0.16, pitch: 1.1 }); }
          on = null;
        }

    }
    // the pull-out lands on the chase view
    a.ting(C.chime + F, { note: 'E6', gain: 0.12 });
    a.ting(C.chime + 0.09 + F, { note: 'B6', gain: 0.08 });
  },
  probe(t) { const fd = frameData(t); return { td: fd.td, v: fd.v, yaw: fd.yaw }; },
});
